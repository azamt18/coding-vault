name: .NET CI

on:
  push:
    branches: [ main ]
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore csharp/CodingTasks.sln

    - name: Build Solution
      run: dotnet build csharp/CodingTasks.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test csharp/CodingTasks.sln --no-build --configuration Release --verbosity normal
