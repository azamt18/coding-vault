<!doctype html>
<html lang="uz">
<meta charset="utf-8" />
<style>
  body { margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .shot { width: 1280px; height: 800px; display: flex; align-items: center; gap: 64px; padding: 0 96px; box-sizing: border-box; background: #f3f7f5; color: #1a1d21; }
  .copy { flex: 1; }
  h1 { font-size: 56px; line-height: 1.1; margin: 0 0 20px; }
  .rules { font-size: 30px; font-weight: 700; color: #0b7a5c; margin: 0 0 40px; }
  .typing { background: #fff; border: 1px solid #dfe5e2; border-radius: 14px; padding: 22px 26px; font-size: 26px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .typing p { margin: 0; }
  .before { color: #8a9096; text-decoration: line-through; margin-bottom: 10px !important; }
  .after b { color: #0b7a5c; }
  .privacy { margin-top: 32px; font-size: 22px; color: #0b7a5c; font-weight: 600; }
  .popup { width: 330px; border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,.14); }
  .tile { width: 440px; height: 280px; background: #0b7a5c; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box; }
  .tile h2 { font-size: 40px; margin: 0 0 10px; }
  .tile p { font-size: 22px; margin: 0; font-weight: 600; opacity: .95; }
</style>
<div class="shot" id="shot">
  <div class="copy">
    <h1>Yangi alifboda<br />odatdagidek yozing</h1>
    <p class="rules">sh→ş · ch→ç · oʻ→ö · gʻ→ğ</p>
    <div class="typing">
      <p class="before">Toshkent shahri juda chiroyli, bog'lari ko'p</p>
      <p class="after">To<b>ş</b>kent <b>ş</b>ahri juda <b>ç</b>iroyli, bo<b>ğ</b>lari k<b>ö</b>p</p>
    </div>
    <p class="privacy">Heç narsa kompyuteringizdan çiqmaydi.</p>
  </div>
  <img class="popup" src="popup-light.png" alt="" />
</div>
<div class="tile" id="tile">
  <h2>Yangi Yozuv</h2>
  <p>sh→ş · ch→ç · oʻ→ö · gʻ→ğ</p>
</div>
</html>
